<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ Chatbot</title>
<style>
body{font-family: Arial; background:#f2f2f2; margin:0; padding:0; display:flex; justify-content:center; align-items:center; height:100vh;}
.chat-box{width:90%; max-width:400px; background:white; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.2); display:flex; flex-direction:column; height:80vh;}
.header{background:#007bff; color:white; padding:15px; border-radius:15px 15px 0 0; text-align:center; font-weight:bold;}
.messages{flex:1; padding:15px; overflow-y:auto;}
.msg{margin:10px 0; padding:10px 12px; border-radius:10px; max-width:80%;}
.user{background:#007bff; color:white; margin-left:auto;}
.bot{background:#e9e9e9; color:black;}
.input-area{display:flex; padding:10px; border-top:1px solid #ddd;}
input{flex:1; padding:10px; border-radius:20px; border:1px solid #ccc; outline:none;}
button{margin-left:10px; padding:10px 15px; border:none; background:#007bff; color:white; border-radius:20px;}
.faq-btns{padding:10px; display:flex; flex-wrap:wrap; gap:5px;}
.faq-btns button{background:#eee; color:#333; font-size:12px; border:1px solid #ccc;}
</style>
</head>
<body>
<div class="chat-box">
<div class="header">FAQ Chatbot</div>
<div class="faq-btns">
<button onclick="ask('What is your service?')">What is your service?</button>
<button onclick="ask('Pricing?')">Pricing?</button>
<button onclick="ask('Contact?')">Contact?</button>
<button onclick="ask('Working hours?')">Working hours?</button>
</div>
<div class="messages" id="messages">
<div class="msg bot">Hi! I am FAQ Chatbot. Ask me anything.</div>
</div>
<div class="input-area">
<input type="text" id="userInput" placeholder="Type your question...">
<button onclick="send()">Send</button>
</div>
</div>

<script>
const faq = {
"what is your service": "We provide 24/7 customer support chatbot services.",
"pricing": "Our plan starts at $10 per month.",
"contact": "You can contact us at support@example.com",
"working hours": "We are available 24/7.",
"hello": "Hello! How can I help you?",
"hi": "Hi there! Ask your question."
};

function addMsg(text, type){
const div = document.createElement('div');
div.className = 'msg ' + type;
div.innerText = text;
document.getElementById('messages').appendChild(div);
document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function ask(q){
document.getElementById('userInput').value = q;
send();
}

function send(){
let input = document.getElementById('userInput').value.toLowerCase().trim();
if(!input) return;
addMsg(document.getElementById('userInput').value, 'user');
let reply = "Sorry, I don't have answer for that. Try: What is your service?, Pricing?, Contact?";
for(let key in faq){
if(input.includes(key)){
reply = faq[key];
break;
}
}
setTimeout(()=>{ addMsg(reply, 'bot'); }, 500);
document.getElementById('userInput').value = "";
}
</script>
</body>
</html>
